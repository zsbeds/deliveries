<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deliveries</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Deliveries">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181b" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
:root{
  --bg:#f4f1ea; --card:#ffffff; --ink:#1d1f22; --muted:#6b6f76; --line:#e2ddd2;
  --accent:#1f6f54; --accent-ink:#ffffff; --accent-soft:#dcefe6;
  --warn:#b4471f; --warn-soft:#f8e3d9; --done:#8a8f96; --money:#8a5a00; --money-soft:#f6ead2;
  --radius:14px; --tap:48px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#16181b; --card:#212429; --ink:#eceef0; --muted:#9aa0a8; --line:#33373d;
    --accent:#3fb489; --accent-ink:#0d1a14; --accent-soft:#1f3a30;
    --warn:#f08a62; --warn-soft:#3d261d; --done:#6c7178; --money:#e8b85a; --money-soft:#3a2f1a;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:17px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto;padding:12px 14px 24px}
h1{font-size:28px;margin:8px 2px 14px;letter-spacing:-.02em}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 4px 8px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
label{display:block;font-size:14px;color:var(--muted);margin:12px 2px 5px;font-weight:600}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);
  border-radius:10px;padding:11px 12px;min-height:var(--tap);outline:none;-webkit-appearance:none;appearance:none}
textarea{resize:vertical;min-height:70px}
input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
button,.btn{font:inherit;font-weight:600;border:0;border-radius:12px;min-height:var(--tap);padding:0 16px;
  background:var(--accent-soft);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;
  justify-content:center;gap:6px;text-decoration:none;touch-action:manipulation;text-align:center}
button:active,.btn:active{transform:scale(.98)}
.primary{background:var(--accent);color:var(--accent-ink)}
.danger{background:var(--warn-soft);color:var(--warn)}
.money{background:var(--money-soft);color:var(--money)}
.ghost{background:transparent;border:1px solid var(--line)}
.wide{width:100%}
.row{display:flex;gap:8px;align-items:center}
.row > *{flex:1}
.muted{color:var(--muted)}
.small{font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:44px;padding:0 14px;border-radius:22px;background:var(--card);
  border:1px solid var(--line);font-weight:600;font-size:15px;line-height:1.1;flex-direction:column}
.chip small{font-weight:500;font-size:12px;color:var(--muted)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.on small{color:inherit;opacity:.85}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg .chip{padding:0 4px}
.item{border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:10px}
.item:last-of-type{border-bottom:0}
.item-line2{display:grid;grid-template-columns:110px 1fr 40px;gap:8px;align-items:center;margin-top:8px}
.price-wrap{position:relative}
.price-wrap span{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.price-wrap input{padding-left:24px}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.stepper button{flex:1;min-width:44px;border-radius:0;background:transparent;font-size:22px;padding:0}
.stepper input{width:46px;flex:0 0 46px;min-height:46px;text-align:center;border:0;padding:0;background:transparent;font-weight:700}
.stepper input:focus{box-shadow:none}
.x{min-width:40px;padding:0;background:transparent;color:var(--muted);font-size:22px}
.suggest{position:relative}
.sugg-list{position:absolute;left:0;right:0;top:100%;z-index:20;background:var(--card);border:1px solid var(--line);
  border-radius:12px;margin-top:4px;box-shadow:0 8px 24px rgba(0,0,0,.15);overflow:hidden;max-height:260px;overflow-y:auto}
.sugg-list > div{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.sugg-list > div:last-child{border-bottom:0}
.sugg-list > div:active{background:var(--accent-soft)}
.sugg-list .sub{font-size:13px;color:var(--muted)}
.total-line{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;font-size:15px}
.total-line strong{font-size:20px}
.pc-status{font-size:14px;margin:6px 2px 0;min-height:1em}
.pc-status.ok{color:var(--accent)} .pc-status.bad{color:var(--warn)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);
  display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;flex-direction:column;gap:2px;background:transparent;font-size:12px;color:var(--muted);min-height:54px;font-weight:600;padding:0 2px}
nav.tabs button svg{width:26px;height:26px}
nav.tabs button.on{color:var(--accent)}
.load-item{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;min-height:var(--tap)}
.load-item:last-child{border-bottom:0}
.qty{font-weight:800;font-size:22px;min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
.tick{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.load-item.done .tick,.text-row.done .tick{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.load-item.done .name,.load-item.done .qty{color:var(--done);text-decoration:line-through}
.stop.delivered{opacity:.62}
.stop-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.stop h3{margin:0 0 2px;font-size:19px}
.stop .num{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
  font-size:14px;font-weight:800;align-items:center;justify-content:center;margin-right:6px;vertical-align:2px}
.stop .addr{margin:2px 0 8px}
.stop ul{margin:6px 0 8px;padding-left:20px}
.edit-link{min-height:36px;padding:0 12px;font-size:14px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.actions .btn,.actions button{padding:0 6px;font-size:15px}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:20px;background:var(--accent-soft);color:var(--accent);vertical-align:middle;margin-left:4px}
.badge.owe{background:var(--money-soft);color:var(--money)}
.amount{font-weight:700;margin:0 0 4px}
.amount.owe{color:var(--money)}
.text-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.text-row:last-of-type{border-bottom:0}
.text-row .who{flex:1}
.text-row.done .who{color:var(--done)}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:15px}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px}
.summary div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.summary strong{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.summary span{font-size:12px;color:var(--muted);font-weight:600}
.summary .owe strong{color:var(--money)}
.reorder{display:flex;flex-direction:column;gap:6px}
.reorder button{min-height:44px;min-width:56px;font-size:20px;padding:0}
.result{display:block;width:100%;text-align:left;justify-content:flex-start;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:12px 14px;margin-bottom:8px;font-weight:400;flex-direction:column;align-items:stretch}
.result .top{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:24px;font-weight:600;opacity:0;transition:.25s;z-index:80;
  max-width:90vw;text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:20px 16px calc(16px + env(safe-area-inset-bottom));max-height:85vh;overflow-y:auto}
.sheet p{margin:0 0 14px}
.sheet .opts{display:grid;gap:10px}
.prod-row{display:grid;grid-template-columns:1fr 100px 40px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.prod-row:last-child{border-bottom:0}
.hidden{display:none !important}
.editing-bar{background:var(--accent-soft);border-radius:12px;padding:10px 14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
</style>
</head>
<body>
<main id="app"></main>

<nav class="tabs" id="tabs">
  <button data-tab="new">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>New order</button>
  <button data-tab="deliveries">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg>Deliveries</button>
  <button data-tab="orders">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>Orders</button>
  <button data-tab="settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Settings</button>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ============ Storage: everything stays in this phone's browser ============ */
const KEY = "delivery-logger-v1";
const DEFAULT_MSG = "Hi {name}, I'm out for delivery today and will be with you soon. Thanks, {business}";
const DEFAULT_REMIND = "Hi {name}, just a reminder that your order will be delivered on {date}. Please let me know if you won't be in. Thanks, {business}";
let storageOK = true;
function blankSettings(){ return {business:"", message:DEFAULT_MSG, reminder:DEFAULT_REMIND, via:"whatsapp"}; }
function blank(){ return {v:2, orders:[], products:[], prices:{}, settings:blankSettings(), loaded:{}, sent:{}, routes:{}, lastBackup:null}; }
function upgrade(d){
  const b = blank();
  d = Object.assign(b, d);
  d.settings = Object.assign(blankSettings(), d.settings || {});
  d.prices = d.prices || {}; d.sent = d.sent || {}; d.routes = d.routes || {}; d.loaded = d.loaded || {};
  d.orders.forEach(o => {
    o.items = (o.items || []).map(i => ({name:i.name, qty:i.qty||0, price:i.price||0}));
    if(o.paid === undefined) o.paid = false;
    if(!o.payMethod) o.payMethod = o.paid ? "cash" : "none";
  });
  delete d.texted;
  d.v = 2;
  return d;
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    return raw ? upgrade(JSON.parse(raw)) : blank();
  }catch(e){ storageOK = false; return blank(); }
}
let db = load();
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(db)); storageOK = true; }
  catch(e){ storageOK = false; }
}
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}

/* ============ Helpers ============ */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromIso = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const today = () => iso(new Date());
function addDays(s, n){ const d = fromIso(s); d.setDate(d.getDate()+n); return iso(d); }
function niceDate(s, long){
  const t = today();
  const base = fromIso(s).toLocaleDateString("en-GB", long ? {weekday:"long", day:"numeric", month:"long"} : {weekday:"short", day:"numeric", month:"short"});
  if(s === t) return "Today · " + base;
  if(s === addDays(t,1)) return "Tomorrow · " + base;
  return base;
}
const shortDay = d => d===today() ? "Today" : d===addDays(today(),1) ? "Tomorrow" : fromIso(d).toLocaleDateString("en-GB",{weekday:"short"});
const dayMonth = d => fromIso(d).toLocaleDateString("en-GB",{day:"numeric", month:"short"});
const cleanPhone = p => String(p||"").replace(/[^\d+]/g, "");
const normPostcode = p => String(p||"").toUpperCase().replace(/\s+/g," ").trim();
const money = p => "£" + (Math.round(p||0)/100).toFixed(2);
function toPence(v){
  const n = parseFloat(String(v||"").replace(/[£,\s]/g,""));
  return isFinite(n) && n > 0 ? Math.round(n*100) : 0;
}
const penceInput = p => p ? (p/100).toFixed(2) : "";
const orderTotal = o => o.items.reduce((s,i)=>s + (i.qty||0)*(i.price||0), 0);
const owes = o => !o.paid && orderTotal(o) > 0;
const PAY = {none:"Not paid", cash:"Cash", card:"Card", transfer:"Transfer"};
const fullAddress = o => [o.address, o.postcode].filter(Boolean).join(", ").replace(/\n/g, ", ");

function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("show"), 2200);
}
function buzz(){ try{ navigator.vibrate && navigator.vibrate(30); }catch(e){} }
function sheet(html, onClick){
  const bg = document.createElement("div");
  bg.className = "sheet-bg";
  bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  const close = () => bg.remove();
  bg.addEventListener("click", e => {
    if(e.target === bg || e.target.closest("[data-close]")) return close();
    onClick && onClick(e, close, bg);
  });
  document.body.appendChild(bg);
  return bg;
}
function confirmSheet(message, okLabel, onOk){
  sheet(`<p>${esc(message)}</p><div class="row"><button class="ghost" data-close>Cancel</button><button class="danger" data-yes>${esc(okLabel)}</button></div>`,
    (e, close) => { if(e.target.closest("[data-yes]")){ close(); onOk(); } });
}
function choiceSheet(message, options, onPick){
  sheet(`<p>${esc(message)}</p><div class="opts">${options.map(o => `<button class="${o.cls||"ghost"}" data-v="${esc(o.value)}">${esc(o.label)}</button>`).join("")}
    <button class="ghost" data-close>Cancel</button></div>`,
    (e, close) => { const b = e.target.closest("[data-v]"); if(b){ close(); onPick(b.dataset.v); } });
}

/* ============ Catalogue & prices: learned from orders ============ */
function canonicalProduct(name){
  const n = String(name||"").trim().replace(/\s+/g," ");
  if(!n) return "";
  return db.products.find(p => p.toLowerCase() === n.toLowerCase()) || n;
}
function learnProducts(items){
  items.forEach(it => {
    if(!db.products.some(p => p.toLowerCase() === it.name.toLowerCase())) db.products.push(it.name);
    if(it.price > 0) db.prices[it.name] = it.price;
  });
  db.products.sort((a,b)=>a.localeCompare(b));
}
const priceOf = name => db.prices[canonicalProduct(name)] || 0;

/* ============ Customers: remembered from past orders ============ */
function customers(){
  const map = new Map();
  [...db.orders].sort((a,b)=>a.createdAt - b.createdAt).forEach(o => {
    const k = cleanPhone(o.phone) || o.name.trim().toLowerCase();
    map.set(k, {name:o.name, phone:o.phone, address:o.address, postcode:o.postcode, items:o.items});
  });
  return [...map.values()];
}

/* ============ Suggestion dropdown (sync or async options) ============ */
function attachSuggest(input, getOptions, onPick, minLen=1){
  const wrap = input.parentElement;
  let list = null, seq = 0, timer;
  const close = () => { if(list){ list.remove(); list = null; } };
  async function open(){
    const q = input.value.trim().toLowerCase();
    const my = ++seq;
    if(q.length < minLen){ close(); return; }
    let opts = getOptions(q);
    if(opts && opts.then){ try{ opts = await opts; }catch(e){ opts = []; } }
    if(my !== seq || document.activeElement !== input) return;
    close();
    opts = (opts||[]).slice(0,6);
    if(!opts.length) return;
    list = document.createElement("div");
    list.className = "sugg-list";
    opts.forEach(o => {
      const d = document.createElement("div");
      d.innerHTML = `<div>${esc(o.label)}</div>${o.sub ? `<div class="sub">${esc(o.sub)}</div>` : ""}`;
      d.addEventListener("pointerdown", e => { e.preventDefault(); close(); onPick(o); });
      list.appendChild(d);
    });
    wrap.appendChild(list);
  }
  input.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(open, 120); });
  input.addEventListener("focus", open);
  input.addEventListener("blur", () => setTimeout(close, 150));
}

/* ============ Postcode check (free postcodes.io – only the postcode is sent) ============ */
const pcCache = new Map();
async function pcFetch(path){
  const ctl = new AbortController(); const t = setTimeout(()=>ctl.abort(), 5000);
  try{
    const r = await fetch("https://api.postcodes.io/postcodes/" + path, {signal:ctl.signal});
    return await r.json();
  }finally{ clearTimeout(t); }
}
async function pcAutocomplete(q){
  const k = "ac:" + q;
  if(!pcCache.has(k)){
    const j = await pcFetch(encodeURIComponent(q) + "/autocomplete?limit=6");
    pcCache.set(k, (j && j.result) || []);
  }
  return pcCache.get(k);
}
async function pcLookup(pc){
  const k = "pc:" + pc.replace(/\s/g,"");
  if(!pcCache.has(k)){
    const j = await pcFetch(encodeURIComponent(pc.replace(/\s/g,"")));
    pcCache.set(k, j && j.status === 200 ? j.result : null);
  }
  return pcCache.get(k);
}
async function checkPostcode(){
  const el = $("#pc-status"); if(!el) return;
  const pc = form.postcode;
  el.className = "pc-status"; el.textContent = "";
  if(pc.replace(/\s/g,"").length < 5) return;
  try{
    const r = await pcLookup(pc);
    if(form.postcode !== pc || !$("#pc-status")) return;
    if(r){
      el.className = "pc-status ok";
      el.textContent = "✓ " + [r.admin_ward, r.admin_district].filter(Boolean).join(", ");
      if(r.postcode && r.postcode !== form.postcode){ form.postcode = r.postcode; $("#f-postcode").value = r.postcode; }
    }else{
      el.className = "pc-status bad";
      el.textContent = "⚠ Postcode not found – please check it";
    }
  }catch(e){ /* offline – no check, no problem */ }
}

/* ============ App state ============ */
let tab = "new";
let viewDate = today();
let form = null;
let editingId = null;
let msgMode = null;      // null | "remind" | "onway"
let reorderMode = false;
let ordersFilter = "upcoming";
let ordersQuery = "";

function emptyForm(){
  return {name:"", phone:"", address:"", postcode:"", date:addDays(today(),1), items:[{name:"", qty:1, price:0}], notes:"", payMethod:"none", lastItems:null};
}
function setTab(t){
  tab = t;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  render(); window.scrollTo(0,0);
}
document.querySelectorAll("#tabs button").forEach(b => b.addEventListener("click", () => {
  if(b.dataset.tab !== "deliveries"){ msgMode = null; reorderMode = false; }
  setTab(b.dataset.tab);
}));
function render(){
  ({new:renderNew, deliveries:renderDeliveries, orders:renderOrders, settings:renderSettings})[tab]();
}
const storageBanner = () => storageOK ? "" :
  `<div class="banner">This browser isn't letting the app save. Open it from the Home Screen icon (not a private Safari tab).</div>`;
function startEdit(id){
  const o = db.orders.find(o => o.id === id);
  editingId = o.id;
  form = {name:o.name, phone:o.phone, address:o.address, postcode:o.postcode, date:o.date,
          items:o.items.map(i=>({...i})), notes:o.notes||"", payMethod:o.paid ? (o.payMethod||"cash") : "none", lastItems:null};

}

/* ================= NEW ORDER ================= */
function renderNew(){
  if(!form) form = emptyForm();
  const chips = [];
  for(let i=0;i<8;i++){
    const d = addDays(today(), i);
    chips.push(`<button type="button" class="chip ${form.date===d?"on":""}" data-date="${d}">${shortDay(d)}<small>${dayMonth(d)}</small></button>`);
  }

    ${storageBanner()}

        ${form.lastItems ? `<button type="button" class="ghost wide" id="sameAsLast" style="margin-bottom:12px">↻ Same as last time (${esc(form.lastItems.map(i=>i.qty+"× "+i.name).join(", "))})</button>` : ""}

      </div>

      <div style="margin-top:18px;display:grid;gap:10px">

  $("#payChips").addEventListener("click", e => {

      .filter(c => c.name.toLowerCase().includes(q) || (q.replace(/\s/g,"").length > 3 && cleanPhone(c.phone).includes(q.replace(/\s/g,""))))

function renderItems(){
  const box = $("#items");
  box.innerHTML = form.items.map((it, i) => `
    <div class="item" data-i="${i}">
      <div class="suggest"><input class="item-name" value="${esc(it.name)}" placeholder="Product" aria-label="Product ${i+1}" autocapitalize="sentences"></div>
      <div class="item-line2">
        <div class="price-wrap"><span>£</span><input class="item-price" inputmode="decimal" value="${penceInput(it.price)}" placeholder="price" aria-label="Price each"></div>
        <div class="stepper">
          <button type="button" data-step="-1" aria-label="One fewer">−</button>
          <input class="item-qty" type="number" inputmode="numeric" min="1" value="${it.qty}" aria-label="Quantity">
          <button type="button" data-step="1" aria-label="One more">+</button>
        </div>
        <button type="button" class="x" data-remove aria-label="Remove product">×</button>
      </div>
    </div>`).join("");
  box.querySelectorAll(".item").forEach(row => {
    const i = +row.dataset.i;
    const nameIn = $(".item-name", row), qtyIn = $(".item-qty", row), priceIn = $(".item-price", row);
    const fillPrice = () => { if(!form.items[i].price){ const p = priceOf(form.items[i].name); if(p){ form.items[i].price = p; priceIn.value = penceInput(p); updateTotals(); } } };
    nameIn.addEventListener("input", () => { form.items[i].name = nameIn.value; });
    nameIn.addEventListener("blur", fillPrice);
    priceIn.addEventListener("input", () => { form.items[i].price = toPence(priceIn.value); updateTotals(); });
    priceIn.addEventListener("blur", () => { priceIn.value = penceInput(form.items[i].price); });
    qtyIn.addEventListener("input", () => { form.items[i].qty = Math.max(0, parseInt(qtyIn.value,10) || 0); updateTotals(); });
    row.querySelectorAll("[data-step]").forEach(b => b.addEventListener("click", () => {
      form.items[i].qty = Math.max(1, (form.items[i].qty||0) + +b.dataset.step);
      qtyIn.value = form.items[i].qty; updateTotals();
    }));
    $("[data-remove]", row).addEventListener("click", () => {
      form.items.splice(i,1); if(!form.items.length) form.items.push({name:"", qty:1, price:0}); renderItems();
    });
    attachSuggest(nameIn,
      q => db.products.filter(p => p.toLowerCase().includes(q) && p.toLowerCase() !== q)
             .map(p => ({label:p, sub: db.prices[p] ? money(db.prices[p]) + " each" : ""})),
      o => { form.items[i].name = o.label; nameIn.value = o.label; form.items[i].price = 0; fillPrice(); qtyIn.focus(); qtyIn.select(); });
  });
  updateTotals();
}
function updateTotals(){
  const live = form.items.filter(i => i.name.trim());
  const n = live.reduce((s,i)=>s+(i.qty||0),0);
  const t = live.reduce((s,i)=>s+(i.qty||0)*(i.price||0),0);
  if($("#itemCount")) $("#itemCount").textContent = n;
  if($("#orderTotal")) $("#orderTotal").textContent = t ? money(t) : "";
}

function saveOrder(){
  const name = form.name.trim();
  const merged = [];
  form.items.map(i => ({name: canonicalProduct(i.name), qty: parseInt(i.qty,10) || 0, price: i.price || 0}))
    .filter(i => i.name && i.qty > 0)
    .forEach(i => { const m = merged.find(x => x.name === i.name && x.price === i.price); m ? m.qty += i.qty : merged.push(i); });
  if(!name){ toast("Add the customer's name"); $("#f-name").focus(); return; }
  if(!merged.length){ toast("Add at least one product"); return; }
  if(!form.date){ toast("Pick a delivery date"); return; }

  learnProducts(merged);
  const paid = form.payMethod !== "none";
  const data = {name, phone:form.phone.trim(), address:form.address.trim(), postcode:normPostcode(form.postcode),
    date:form.date, items:merged, notes:form.notes.trim(), paid, payMethod: form.payMethod};
  if(editingId){
    Object.assign(db.orders.find(o => o.id === editingId), data);
    toast(`Updated – ${name}`);
  }else{
    db.orders.push({id:uid(), ...data, delivered:false, createdAt:Date.now()});
    toast(`Saved – ${name}, ${niceDate(form.date)}`);
  }
  save(); buzz();
  const wasEditing = editingId;
  editingId = null; form = emptyForm();
  if(wasEditing){ viewDate = data.date; setTab("deliveries"); } else { renderNew(); window.scrollTo(0,0); }
}

/* ================= MESSAGES ================= */
const useWA = () => db.settings.via !== "sms";
const msgApp = () => useWA() ? "WhatsApp" : "Text";
const msgTarget = () => useWA() ? 'target="_blank" rel="noopener"' : "";
function waNumber(p){
  let n = cleanPhone(p);
  if(n.startsWith("+")) n = n.slice(1);
  else if(n.startsWith("00")) n = n.slice(2);
  else if(n.startsWith("0")) n = "44" + n.slice(1);
  return n.replace(/\D/g,"");
}
function messageFor(o, kind="onway"){
  const tpl = kind === "remind" ? (db.settings.reminder || DEFAULT_REMIND) : (db.settings.message || DEFAULT_MSG);
  const total = orderTotal(o);
  return tpl
    .replaceAll("{name}", o.name.trim().split(/\s+/)[0])
    .replaceAll("{business}", db.settings.business || "")
    .replaceAll("{date}", fromIso(o.date).toLocaleDateString("en-GB",{weekday:"long", day:"numeric", month:"long"}))
    .replaceAll("{total}", total && !o.paid ? money(total) : "")
    .replace(/[ \t]+/g," ").replace(/[,\s]+$/, "").trim();
}
const msgHref = (o, kind) => useWA()
  ? `https://wa.me/${waNumber(o.phone)}?text=${encodeURIComponent(messageFor(o, kind))}`
  : `sms:${cleanPhone(o.phone)}?&body=${encodeURIComponent(messageFor(o, kind))}`;

/* ================= DELIVERIES ================= */
function ordersOn(d){
  const route = db.routes[d] || [];
  const pos = id => { const i = route.indexOf(id); return i < 0 ? 1e6 : i; };
  return db.orders.filter(o => o.date === d).sort((a,b) =>
    pos(a.id) - pos(b.id) || (a.postcode||"").localeCompare(b.postcode||"") || a.name.localeCompare(b.name));
}
function routeLinks(list){
  const stops = list.filter(o => !o.delivered && (o.address || o.postcode));
  const legs = [];
  for(let i = 0; i < stops.length; i += 10){
    const chunk = stops.slice(i, i+10);
    const origin = i ? fullAddress(stops[i-1]) : "";
    const dest = chunk[chunk.length-1];
    const way = chunk.slice(0,-1).map(fullAddress).join("|");
    let url = "https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=" + encodeURIComponent(fullAddress(dest));
    if(origin) url += "&origin=" + encodeURIComponent(origin);
    if(way) url += "&waypoints=" + encodeURIComponent(way);
    legs.push({url, from:i+1, to:i+chunk.length});
  }
  return legs;
}

function renderDeliveries(){
  const t = today();
  const dates = [...new Set([t, viewDate, ...db.orders.filter(o => o.date >= t && !o.delivered).map(o => o.date)])].sort();
  const chips = dates.map(d => `<button class="chip ${d===viewDate?"on":""}" data-date="${d}">${shortDay(d)}<small>${dayMonth(d)} · ${db.orders.filter(o=>o.date===d).length}</small></button>`).join("");

  const list = ordersOn(viewDate);
  const loaded = db.loaded[viewDate] || {};
  const sent = db.sent[viewDate] || {};
  const totals = {};
  list.forEach(o => o.items.forEach(i => totals[i.name] = (totals[i.name]||0) + i.qty));
  const prodNames = Object.keys(totals).sort((a,b)=>a.localeCompare(b));

      ${withPhone.map(o => { const done = sent[kind+":"+o.id]; return `<div class="text-row ${done?"done":""}">
        <span class="tick">${done?"✓":""}</span>
        <span class="who">${esc(o.name)}<br><span class="small muted">${esc(o.phone)}</span></span>
        <a class="btn ${done?"ghost":"primary"}" href="${msgHref(o, kind)}" ${msgTarget()} data-sent="${o.id}">${done?"Again":msgApp()}</a></div>`; }).join("")}
      ${list.length > withPhone.length ? `<p class="small muted" style="margin:8px 0 0">${list.length-withPhone.length} customer(s) have no phone number.</p>` : ""}
      <button class="ghost wide" id="endMsg" style="margin-top:10px">Done</button>
    </div>`;
  }

  $("#app").innerHTML = `
    ${storageBanner()}
    ${needBackup ? `<div class="banner">It's been a while since your last backup. <a href="#" id="goBackup" style="color:inherit;font-weight:700">Back up now</a></div>` : ""}
    <h1>Deliveries</h1>
    <div class="chips" id="dayChips">${chips}</div>
    <input type="date" id="pickDay" value="${viewDate}" aria-label="Pick a day" style="margin:4px 0 6px">

    ${!list.length ? `<div class="empty">No orders for ${esc(niceDate(viewDate, true))}.</div>` : `
    <div class="summary">
      <div><strong>${list.filter(o=>o.delivered).length}/${list.length}</strong><span>delivered</span></div>
      <div><strong>${money(dayTotal)}</strong><span>day's total</span></div>
      <div class="${toCollect?"owe":""}"><strong>${money(toCollect)}</strong><span>to collect</span></div>
    </div>

    <h2>Load the van · ${loadedCount}/${prodNames.length}</h2>
    <div class="card" id="vanList" style="padding:4px 12px">
      ${prodNames.map(p => `<div class="load-item ${loaded[p]?"done":""}" data-p="${esc(p)}" role="checkbox" aria-checked="${!!loaded[p]}" tabindex="0">
        <span class="tick">${loaded[p]?"✓":""}</span><span class="name" style="flex:1">${esc(p)}</span><span class="qty">${totals[p]}</span></div>`).join("")}
    </div>

    <h2>Messages</h2>
    ${msgPanel || `<div style="display:grid;gap:8px">
      <button class="ghost wide" data-msg="remind">📅 Send delivery reminders (${sentCount("remind")}/${withPhone.length})</button>
      <button class="primary wide" data-msg="onway" style="min-height:56px">🚐 ${msgApp()} everyone I'm on my way (${sentCount("onway")}/${withPhone.length})</button>
    </div>`}

    <h2>Route</h2>
    ${legs.length ? `<div style="display:grid;gap:8px">${legs.map(l => `<a class="btn primary" href="${l.url}" target="_blank" rel="noopener">🗺️ Open route in Google Maps${legs.length>1?` (stops ${l.from}–${l.to})`:""}</a>`).join("")}</div>
      <p class="small muted" style="margin:6px 4px 0">Starts from where you are, in the stop order below. Delivered stops are left out.${legs.length>1?" Google allows 10 stops per route, so open the next part when you finish the first.":""}</p>`
      : `<p class="small muted" style="margin:0 4px">All stops delivered.</p>`}
    <button class="ghost wide" id="toggleReorder" style="margin-top:8px">${reorderMode ? "✓ Finished changing order" : "↕︎ Change stop order"}</button>

          </div>
          ${reorderMode ? `<div class="reorder">

              <button class="ghost" data-move="1" data-id="${o.id}" aria-label="Move ${esc(o.name)} later" ${idx===list.length-1?"disabled":""}>▼</button></div>`

        ${tot ? `<p class="amount ${owes(o)?"owe":""}">${owes(o) ? money(tot) + " to collect" : money(tot) + " · paid"}</p>` : ""}
        ${o.notes ? `<p class="small" style="margin:0 0 6px">📝 ${esc(o.notes)}</p>` : ""}
        ${o.phone ? `<p class="small muted" style="margin:0">${esc(o.phone)}</p>` : ""}
        <div class="actions">
          ${o.phone ? `<a class="btn" href="tel:${cleanPhone(o.phone)}">📞 Call</a><a class="btn" href="${msgHref(o,"onway")}" ${msgTarget()}>💬 ${msgApp()}</a>` : `<span></span><span></span>`}

  const app = $("#app");

  const van = $("#vanList");
  if(van){
    const toggle = el => { const p = el.dataset.p; (db.loaded[viewDate] = db.loaded[viewDate] || {})[p] = !loaded[p]; save(); buzz(); renderDeliveries(); };

  app.querySelectorAll("[data-sent]").forEach(a => a.addEventListener("click", () => {
    (db.sent[viewDate] = db.sent[viewDate] || {})[msgMode + ":" + a.dataset.sent] = true; save();

  app.querySelectorAll("[data-deliver]").forEach(b => b.addEventListener("click", () => {

  }));
  app.querySelectorAll("[data-paid]").forEach(b => b.addEventListener("click", () => askPay(find(b.dataset.paid))));
  app.querySelectorAll("[data-unpaid]").forEach(b => b.addEventListener("click", () => {
    const o = find(b.dataset.unpaid); o.paid = false; o.payMethod = "none"; save(); renderDeliveries();
  }));
  app.querySelectorAll("[data-notin]").forEach(b => b.addEventListener("click", () => moveOrder(find(b.dataset.notin))));
}

function moveOrder(o){
  const opts = [];
  for(let i=1;i<=8;i++){ const d = addDays(today(), i); if(d !== o.date) opts.push(d); }
  sheet(`<p><strong>${esc(o.name)} wasn't in.</strong><br>Move their order to:</p>
    <div class="chips" style="flex-wrap:wrap">${opts.map(d => `<button class="chip" data-to="${d}">${shortDay(d)}<small>${dayMonth(d)}</small></button>`).join("")}</div>
    <label for="moveDate">Or another date</label>
    <input type="date" id="moveDate">
    <div class="row" style="margin-top:14px"><button class="ghost" data-close>Cancel</button><button class="primary" data-go>Move</button></div>`,
    (e, close, bg) => {
      const chip = e.target.closest("[data-to]");
      let to = chip ? chip.dataset.to : (e.target.closest("[data-go]") ? $("#moveDate", bg).value : null);
      if(!to) return;
      const note = `Not in on ${fromIso(o.date).toLocaleDateString("en-GB",{weekday:"short", day:"numeric", month:"short"})}`;
      o.notes = o.notes ? o.notes + " · " + note : note;
      o.date = to; o.delivered = false; save(); close();
      toast(`${o.name} moved to ${niceDate(to)}`); renderDeliveries();
    });
}

/* ================= ORDERS (search) ================= */
function renderOrders(){
  const t = today();
  $("#app").innerHTML = `
    ${storageBanner()}
    <h1>Orders</h1>
    <input id="q" type="search" placeholder="Search name, phone, postcode or product" value="${esc(ordersQuery)}" aria-label="Search orders">
    <div class="seg" style="grid-template-columns:repeat(3,1fr);margin:10px 0" id="ordFilter">
      ${[["upcoming","Upcoming"],["unpaid","Unpaid"],["all","All"]].map(([k,v]) => `<button class="chip ${ordersFilter===k?"on":""}" data-f="${k}">${v}</button>`).join("")}
    </div>
    <div id="results"></div>`;
  const draw = () => {
    const q = ordersQuery.trim().toLowerCase(), qd = q.replace(/\s/g,"");
    let list = db.orders.filter(o => ordersFilter === "all" ? true : ordersFilter === "unpaid" ? owes(o) : (o.date >= t && !o.delivered));
    if(q) list = list.filter(o => o.name.toLowerCase().includes(q) || (o.postcode||"").toLowerCase().replace(/\s/g,"").includes(qd)
      || (qd.length > 2 && cleanPhone(o.phone).includes(qd)) || (o.address||"").toLowerCase().includes(q)
      || o.items.some(i => i.name.toLowerCase().includes(q)));
    list.sort((a,b) => ordersFilter === "upcoming" ? a.date.localeCompare(b.date) : b.date.localeCompare(a.date));
    const owed = list.filter(owes).reduce((s,o)=>s+orderTotal(o),0);
    $("#results").innerHTML = !list.length ? `<div class="empty">No orders found.</div>` :
      `${ordersFilter === "unpaid" ? `<p class="amount owe" style="margin:0 4px 10px">${money(owed)} owed in total</p>` : ""}
       <p class="small muted" style="margin:0 4px 8px">${list.length} order${list.length===1?"":"s"}${list.length>150?" – showing the first 150":""}</p>` +
      list.slice(0,150).map(o => { const tot = orderTotal(o); return `<button class="result" data-open="${o.id}">
        <span class="top"><span>${esc(o.name)}</span><span>${tot?money(tot):""}</span></span>
        <span class="small muted">${esc(niceDate(o.date))}${o.postcode?" · "+esc(o.postcode):""}</span>
        <span class="small">${esc(o.items.map(i=>i.qty+"× "+i.name).join(", "))}</span>
        <span>${o.delivered?`<span class="badge" style="margin:4px 4px 0 0">Delivered</span>`:""}${o.paid?`<span class="badge" style="margin:4px 0 0">Paid · ${PAY[o.payMethod]||""}</span>`:(tot?`<span class="badge owe" style="margin:4px 0 0">Not paid</span>`:"")}</span>
      </button>`; }).join("");
  };
  draw();
  $("#q").addEventListener("input", e => { ordersQuery = e.target.value; draw(); });
  $("#ordFilter").addEventListener("click", e => { const b = e.target.closest("[data-f]"); if(b){ ordersFilter = b.dataset.f; renderOrders(); } });
  $("#results").addEventListener("click", e => { const b = e.target.closest("[data-open]"); if(b) startEdit(b.dataset.open); });
}

/* ================= SETTINGS ================= */
function renderSettings(){
  const sample = {name:"Sarah Jones", date:addDays(today(),1), items:[{name:"x", qty:1, price:1500}], paid:false};
  $("#app").innerHTML = `
    ${storageBanner()}
    <h1>Settings</h1>

    <h2>Messages</h2>
    <div class="card">
      <label for="s-business">Business name</label>
      <input id="s-business" value="${esc(db.settings.business)}" placeholder="e.g. Zain's Deliveries">
      <label>Send messages by</label>
      <div class="row" id="s-via">
        <button type="button" class="chip ${useWA()?"on":""}" data-via="whatsapp">WhatsApp</button>
        <button type="button" class="chip ${!useWA()?"on":""}" data-via="sms">Text message</button>
      </div>
      ${useWA() ? `<p class="small muted" style="margin:6px 2px 0">UK numbers starting 07 are converted automatically. If a customer isn't on WhatsApp, WhatsApp will tell you – call them instead.</p>` : ""}
      <label for="s-remind">Reminder (send the day before)</label>
      <textarea id="s-remind" rows="3">${esc(db.settings.reminder)}</textarea>
      <p class="small" style="margin:6px 2px 0"><strong>Preview:</strong> <span id="prev-remind"></span></p>
      <label for="s-message">"On my way" message</label>
      <textarea id="s-message" rows="3">${esc(db.settings.message)}</textarea>
      <p class="small" style="margin:6px 2px 0"><strong>Preview:</strong> <span id="prev-onway"></span></p>
      <p class="small muted" style="margin:10px 2px 0">You can use {name} (first name), {business}, {date} (delivery day) and {total} (amount to pay).</p>
    </div>

    <h2>Products &amp; prices (${db.products.length})</h2>
    <div class="card">
      <p class="small muted" style="margin:0 0 8px">Products and prices are added automatically when you save orders. Changing a price here only affects new orders.</p>
      ${db.products.length ? db.products.map((p,i) => `<div class="prod-row"><span>${esc(p)}</span>
        <div class="price-wrap"><span>£</span><input inputmode="decimal" data-price="${i}" value="${penceInput(db.prices[p])}" aria-label="Price of ${esc(p)}"></div>
        <button class="x" data-del="${i}" aria-label="Remove ${esc(p)}">×</button></div>`).join("")
        : `<p class="muted small" style="margin:0">None yet – they'll appear as you take orders.</p>`}
    </div>

    <h2>Backup</h2>
    <div class="card">
      <p class="small muted" style="margin:0 0 10px">Your orders are stored only on this phone. Save a backup to Files every week or so, in case the phone is lost or reset.
        ${db.lastBackup ? `<br>Last backup: ${new Date(db.lastBackup).toLocaleString("en-GB",{dateStyle:"medium", timeStyle:"short"})}` : "<br>No backup yet."}</p>
      <div style="display:grid;gap:10px">
        <button class="primary" id="backup">Save backup file</button>
        <button class="ghost" id="restoreBtn">Restore from a backup file</button>
        <input type="file" id="restoreFile" accept=".json,application/json" class="hidden">
      </div>
    </div>

    <h2>Tidy up</h2>
    <div class="card">
      <p class="small muted" style="margin:0 0 10px">${db.orders.length} orders stored in total.</p>
      <button class="ghost wide" id="clearOld">Delete delivered, paid orders older than 3 months</button>
    </div>
    <p class="small muted" style="text-align:center;margin-top:20px">Your orders stay on this phone. The only thing sent anywhere is a postcode, to check it's real when you type it.</p>`;

  const prev = () => {
    $("#prev-remind").textContent = messageFor(sample, "remind");
    $("#prev-onway").textContent = messageFor(sample, "onway");
  };
  prev();
  $("#s-business").addEventListener("input", e => { db.settings.business = e.target.value; save(); prev(); });
  $("#s-message").addEventListener("input", e => { db.settings.message = e.target.value; save(); prev(); });
  $("#s-remind").addEventListener("input", e => { db.settings.reminder = e.target.value; save(); prev(); });
  $("#s-via").addEventListener("click", e => { const b = e.target.closest("[data-via]"); if(!b) return; db.settings.via = b.dataset.via; save(); renderSettings(); });
  document.querySelectorAll("[data-price]").forEach(inp => {
    inp.addEventListener("change", () => {
      const p = db.products[+inp.dataset.price]; const v = toPence(inp.value);
      if(v) db.prices[p] = v; else delete db.prices[p];
      inp.value = penceInput(v); save(); toast(`${p}: ${v ? money(v) : "no price"}`);
    });
  });
  document.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", () => {
    const p = db.products[+b.dataset.del];
    confirmSheet(`Stop suggesting "${p}"? Old orders keep it.`, "Remove", () => {
      db.products.splice(+b.dataset.del,1); delete db.prices[p]; save(); renderSettings();
    });
  }));
  $("#backup").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify({...db, exportedAt:new Date().toISOString()}, null, 1)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `deliveries-backup-${today()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    db.lastBackup = Date.now(); save();
    toast("Backup created – save it to Files");
    setTimeout(renderSettings, 500);
  });
  $("#restoreBtn").addEventListener("click", () => $("#restoreFile").click());
  $("#restoreFile").addEventListener("change", e => {
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => {
      let data;
      try{ data = JSON.parse(r.result); }catch(err){ toast("That file isn't a backup"); return; }
      if(!data || !Array.isArray(data.orders)){ toast("That file isn't a backup"); return; }
      confirmSheet(`Replace everything on this phone with the backup (${data.orders.length} orders)?`, "Replace", () => {
        delete data.exportedAt; db = upgrade(data); save(); toast("Backup restored"); renderSettings();
      });
    };
    r.readAsText(f);
  });
  $("#clearOld").addEventListener("click", () => {
    const cutoff = addDays(today(), -91);
    const old = db.orders.filter(o => o.delivered && !owes(o) && o.date < cutoff);
    if(!old.length){ toast("Nothing that old to delete"); return; }
    confirmSheet(`Delete ${old.length} delivered orders from before ${niceDate(cutoff)}? Back up first if you might want them.`, "Delete", () => {
      const ids = new Set(old.map(o=>o.id));
      db.orders = db.orders.filter(o => !ids.has(o.id));
      ["loaded","sent","routes"].forEach(k => Object.keys(db[k]).forEach(d => { if(d < cutoff) delete db[k][d]; }));
      save(); toast("Old orders deleted"); renderSettings();
    });
  });
}

/* ============ Start ============ */
save();
setTab(db.orders.some(o => o.date === today() && !o.delivered) ? "deliveries" : "new");
</script>
</body>
</html>
